name: Continuous Integration

on:
  push:
    branches:
    - staging
    - main
  pull_request:
    branches:
    - staging
    - main

jobs:
  test:
    name: E2e tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x']

    steps:
    - uses: actions/checkout@v4
    - run: echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
    - run: echo "APP_ID=${{ secrets.APP_ID }}" >> $GITHUB_ENV
    - run: npm ci
    - run: npm test
