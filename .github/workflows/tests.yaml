name: Continuous Integration

on:
  push:
    branches:
    - staging
    - main
    - CI/CD-fix
  pull_request:
    branches:
    - staging
    - main
    - CI/CD-fix

jobs:
  test:
    name: E2e tests
    runs-on: node:20
    steps:
    - uses: actions/checkout@v4
    - run: echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
    - run: echo "APP_ID=${{ secrets.APP_ID }}" >> $GITHUB_ENV
    - run: npm ci
    - run: npm test
